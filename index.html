<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competencia de Cohetes de Aire - Tabla de Posiciones</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --card-border: #1f293d;
            --neon-green: #00ff87;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --gold: #fbbf24;
            --silver: #cbd5e1;
            --bronze: #d97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 950px;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .logo-container {
            margin-bottom: 1.25rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            max-height: 75px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(0, 255, 135, 0.25));
        }

        .title {
            color: var(--neon-green);
            font-size: 2.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(0, 255, 135, 0.4);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .admin-toggle-btn {
            position: absolute;
            top: 0;
            right: 0;
            width: 40px;
            height: 40px;
            background: transparent;
            border: none;
            color: transparent;
            cursor: pointer;
            z-index: 10;
        }

        .admin-panel {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--neon-green);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 0 15px rgba(0, 255, 135, 0.15);
        }

        .admin-panel.active { display: block; }

        .admin-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .admin-title {
            color: var(--neon-green);
            font-size: 1.1rem;
            font-weight: 700;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .form-group input {
            background: #0d131f;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 0.6rem;
            color: var(--text-main);
            outline: none;
        }

        .form-group input:focus { border-color: var(--neon-green); }

        .btn-submit {
            background: var(--neon-green);
            color: #000;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn-submit:hover { opacity: 0.9; }

        .controls-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .loading-text {
            font-size: 0.85rem;
            color: var(--neon-green);
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 320px;
        }

        .search-input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 0.65rem 1rem 0.65rem 2.4rem;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        .search-input:focus { border-color: var(--neon-green); }

        .search-icon {
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .table-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        thead {
            background-color: #162032;
            border-bottom: 2px solid var(--card-border);
        }

        th {
            padding: 1rem 1.25rem;
            color: var(--neon-green);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        td {
            padding: 1.1rem 1.25rem;
            border-bottom: 1px solid var(--card-border);
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: rgba(0, 255, 135, 0.03); }

        .pos-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-weight: 800;
            font-size: 0.95rem;
            background: #1f293d;
            color: var(--text-main);
        }

        .pos-1 { background: rgba(251, 191, 36, 0.15); color: var(--gold); border: 1px solid var(--gold); }
        .pos-2 { background: rgba(203, 213, 225, 0.15); color: var(--silver); border: 1px solid var(--silver); }
        .pos-3 { background: rgba(217, 119, 6, 0.15); color: var(--bronze); border: 1px solid var(--bronze); }

        .group-tag {
            display: inline-block;
            background: rgba(31, 41, 61, 0.8);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .team-name { font-weight: 700; color: var(--text-main); font-size: 1.05rem; }
        .rocket-name { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

        .error-val {
            font-weight: 800;
            color: var(--neon-green);
            font-size: 1.05rem;
            text-align: right;
        }

        .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <header>
            <button class="admin-toggle-btn" onclick="toggleAdminMode()" id="adminBtn" title="Admin"></button>
            <div class="logo-container">
                <img src="tecnologico-de-monterrey-blue.png" alt="Tecnológico de Monterrey">
            </div>
            <h1 class="title">🚀 Competencia de Cohetes de Aire 🚀</h1>
            <p class="subtitle">UNIDAD DE FORMACIÓN F1025B</p>
            <p class="subtitle">Tabla de Posiciones General</p>
        </header>

        <div class="admin-panel" id="adminPanel">
            <div class="admin-panel-header">
                <span class="admin-title">📝 Registrar Nuevo Lanzamiento</span>
                <button onclick="toggleAdminMode()" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">✕ Cerrar</button>
            </div>
            <form id="rocketForm" onsubmit="addTeam(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Grupo</label>
                        <input type="text" id="groupName" required placeholder="Ej: Grupo A">
                    </div>
                    <div class="form-group">
                        <label>Nombre del Equipo</label>
                        <input type="text" id="teamName" required placeholder="Ej: IGNITIA">
                    </div>
                    <div class="form-group">
                        <label>Nombre del Cohete</label>
                        <input type="text" id="rocketName" required placeholder="Ej: Ignitia-1">
                    </div>
                    <div class="form-group">
                        <label>Altura Teórica (m)</label>
                        <input type="number" step="0.01" id="theoreticalHeight" required placeholder="Ej: 150.0">
                    </div>
                    <div class="form-group">
                        <label>Altura Sensor (m)</label>
                        <input type="number" step="0.01" id="sensorHeight" required placeholder="Ej: 145.2">
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">Guardar Registro en la Nube</button>
            </form>
        </div>

        <div class="controls-wrapper">
            <div id="statusMsg" class="loading-text">🔄 Sincronizando datos...</div>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar equipo, cohete o grupo..." oninput="renderLeaderboard()">
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="text-align: center; width: 70px;">Pos</th>
                        <th style="text-align: center;">Grupo</th>
                        <th>Equipo / Cohete</th>
                        <th style="text-align: center;">Alt. Teórica</th>
                        <th style="text-align: center;">Alt. Sensor</th>
                        <th style="text-align: right;">% Error</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // PEGA AQUÍ ABAJO TU URL DE GOOGLE APPS SCRIPT ENTRE LAS COMILLAS
        const WEB_APP_URL = https://script.google.com/macros/s/AKfycbwtKBNGjlBFwHBTVGtQ-aSc9DjbpUreL9qJNMSkvk_iUCAr4mHgKXLRGtJJYLThA1CIxA/exec
        
        const ADMIN_PASS_ENCODED = "Um9ja2V0YWRtaW5TcGFjZQ==";
        let isAdmin = false;
        let teams = [];

        function calculateError(theoretical, sensor) {
            if (!theoretical || theoretical === 0) return 0;
            const error = (Math.abs(theoretical - sensor) / theoretical) * 100;
            return Math.round(error * 100) / 100;
        }

        function toggleAdminMode() {
            if (!isAdmin) {
                const pass = prompt("Ingrese la contraseña de administrador:");
                if (pass !== null) {
                    if (pass === atob(ADMIN_PASS_ENCODED)) {
                        isAdmin = true;
                        document.getElementById('adminPanel').classList.add('active');
                    } else {
                        alert("Contraseña incorrecta");
                    }
                }
            } else {
                isAdmin = false;
                document.getElementById('adminPanel').classList.remove('active');
            }
        }

        // Cargar datos desde Google Sheets al abrir la página
        async function fetchTeams() {
            if (WEB_APP_URL.includes("PEGAR_AQUÍ")) {
                document.getElementById('statusMsginnerText = "⚠️ Falta configurar la URL de Google Sheets";
                return;
            }
            try {
                const response = await fetch(WEB_APP_URL);
                teams = await response.json();
                document.getElementById('statusMsg').innerText = "✅ Sincronizado en tiempo real";
                renderLeaderboard();
            } catch (error) {
                document.getElementById('statusMsg').innerText = "❌ Error de conexión";
                console.error("Error al obtener datos:", error);
            }
        }

        function renderLeaderboard() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const sorted = [...teams].sort((a, b) => calculateError(a.theoreticalHeight, a.sensorHeight) - calculateError(b.theoreticalHeight, b.sensorHeight));

            let currentPos = 1;
            const rankedTeams = sorted.map((item, index) => {
                const errorPct = calculateError(item.theoreticalHeight, item.sensorHeight);
                if (index > 0) {
                    const prevErrorPct = calculateError(sorted[index - 1].theoreticalHeight, sorted[index - 1].sensorHeight);
                    if (errorPct !== prevErrorPct) currentPos = index + 1;
                }
                return { ...item, pos: currentPos, errorPct: errorPct };
            });

            const filteredTeams = rankedTeams.filter(item => 
                (item.group && item.group.toLowerCase().includes(searchTerm)) ||
                item.team.toLowerCase().includes(searchTerm) || 
                item.rocket.toLowerCase().includes(searchTerm)
            );

            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '';

            if (filteredTeams.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-state">${teams.length === 0 ? "Aún no hay equipos registrados en la nube." : "No se encontraron resultados."}</td></tr>`;
                return;
            }

            filteredTeams.forEach((item) => {
                const pos = item.pos;
                let badgeHtml = `<span class="pos-badge">${pos}</span>`;
                if (pos === 1) badgeHtml = `<span class="pos-badge pos-1">🥇 1</span>`;
                else if (pos === 2) badgeHtml = `<span class="pos-badge pos-2">🥈 2</span>`;
                else if (pos === 3) badgeHtml = `<span class="pos-badge pos-3">🥉 3</span>`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="text-align: center;">${badgeHtml}</td>
                    <td style="text-align: center;"><span class="group-tag">${escapeHtml(item.group || '-')}</span></td>
                    <td>
                        <div class="team-name">${escapeHtml(item.team)}</div>
                        <div class="rocket-name">Cohete: ${escapeHtml(item.rocket)}</div>
                    </td>
                    <td style="text-align: center;">${item.theoreticalHeight} m</td>
                    <td style="text-align: center;">${item.sensorHeight} m</td>
                    <td class="error-val">${item.errorPct}%</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function addTeam(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "Guardando en la nube...";
            submitBtn.disabled = true;

            const newTeam = {
                group: document.getElementById('groupName').value,
                team: document.getElementById('teamName').value,
                rocket: document.getElementById('rocketName').value,
                theoreticalHeight: parseFloat(document.getElementById('theoreticalHeight').value),
                sensorHeight: parseFloat(document.getElementById('sensorHeight').value)
            };

            try {
                await fetch(WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors", // Requerido para Google Apps Script Webhooks
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(newTeam)
                });

                document.getElementById('rocketForm').reset();
                document.getElementById('adminPanel').classList.remove('active');
                
                // Recargar datos de la tabla después de un par de segundos
                setTimeout(fetchTeams, 1500);
            } catch (error) {
                alert("Error al guardar el registro.");
                console.error(error);
            } finally {
                submitBtn.innerText = "Guardar Registro en la Nube";
                submitBtn.disabled = false;
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // Cargar registros al abrir la página y actualizar automáticamente cada 10 segundos
        window.onload = () => {
            fetchTeams();
            setInterval(fetchTeams, 10000); // Se sincroniza solo cada 10s
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competencia de Cohetes de Aire - Tabla de Posiciones</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --card-border: #1f293d;
            --neon-green: #00ff87;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --gold: #fbbf24;
            --silver: #cbd5e1;
            --bronze: #d97706;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 950px;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .title {
            color: var(--neon-green);
            font-size: 2.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(0, 255, 135, 0.4);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        /* Botón Modo Admin */
        .admin-toggle-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: rgba(31, 41, 61, 0.6);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .admin-toggle-btn:hover {
            color: var(--neon-green);
            border-color: var(--neon-green);
        }

        /* Tarjeta de Formulario (Oculta por defecto) */
        .admin-panel {
            display: none; /* Oculto por defecto */
            background: var(--card-bg);
            border: 1px solid var(--neon-green);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 0 15px rgba(0, 255, 135, 0.15);
        }

        .admin-panel.active {
            display: block; /* Visible al activar modo admin */
        }

        .admin-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .admin-title {
            color: var(--neon-green);
            font-size: 1.1rem;
            font-weight: 700;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .form-group input {
            background: #0d131f;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 0.6rem;
            color: var(--text-main);
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--neon-green);
        }

        .btn-submit {
            background: var(--neon-green);
            color: #000;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        /* Tabla de Posiciones */
        .table-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        thead {
            background-color: #162032;
            border-bottom: 2px solid var(--card-border);
        }

        th {
            padding: 1rem 1.25rem;
            color: var(--neon-green);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        td {
            padding: 1.1rem 1.25rem;
            border-bottom: 1px solid var(--card-border);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.015);
        }

        tr:hover {
            background-color: rgba(0, 255, 135, 0.03);
        }

        .pos-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-weight: 800;
            font-size: 0.95rem;
            background: #1f293d;
            color: var(--text-main);
        }

        .pos-1 { background: rgba(251, 191, 36, 0.15); color: var(--gold); border: 1px solid var(--gold); }
        .pos-2 { background: rgba(203, 213, 225, 0.15); color: var(--silver); border: 1px solid var(--silver); }
        .pos-3 { background: rgba(217, 119, 6, 0.15); color: var(--bronze); border: 1px solid var(--bronze); }

        .team-name { font-weight: 700; color: var(--text-main); font-size: 1.05rem; }
        .rocket-name { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

        .error-val {
            font-weight: 800;
            color: var(--neon-green);
            font-size: 1.05rem;
            text-align: right;
        }

        .btn-delete {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            display: none; /* Solo visible en modo admin */
        }

        .admin-active .btn-delete {
            display: inline-block;
        }

        @media (max-width: 640px) {
            .title { font-size: 1.6rem; }
            th, td { padding: 0.8rem 0.75rem; }
            .admin-toggle-btn { position: relative; margin-bottom: 1rem; }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <header>
            <button class="admin-toggle-btn" onclick="toggleAdminMode()" id="adminBtn">⚙️ Modo Admin</button>
            <h1 class="title">🚀 Competencia de Cohetes</h1>
            <p class="subtitle">Tabla de Posiciones General</p>
        </header>

        <!-- Panel de Administración (Formulario Oculto) -->
        <div class="admin-panel" id="adminPanel">
            <div class="admin-panel-header">
                <span class="admin-title">📝 Registrar Nuevo Lanzamiento</span>
                <button onclick="toggleAdminMode()" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">✕ Cerrar</button>
            </div>
            <form id="rocketForm" onsubmit="addTeam(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nombre del Equipo</label>
                        <input type="text" id="teamName" required placeholder="Ej: IGNITIA">
                    </div>
                    <div class="form-group">
                        <label>Nombre del Cohete</label>
                        <input type="text" id="rocketName" required placeholder="Ej: Ignitia-1">
                    </div>
                    <div class="form-group">
                        <label>Altura Teórica (m)</label>
                        <input type="number" step="0.01" id="theoreticalHeight" required placeholder="Ej: 150.0">
                    </div>
                    <div class="form-group">
                        <label>Altura Sensor (m)</label>
                        <input type="number" step="0.01" id="sensorHeight" required placeholder="Ej: 145.2">
                    </div>
                </div>
                <button type="submit" class="btn-submit">Guardar Registro</button>
            </form>
        </div>

        <!-- Tabla de Clasificación -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="text-align: center; width: 70px;">Pos</th>
                        <th>Equipo / Cohete</th>
                        <th style="text-align: center;">Alt. Teórica</th>
                        <th style="text-align: center;">Alt. Sensor</th>
                        <th style="text-align: right;">% Error</th>
                        <th class="admin-only-col" style="width: 50px;"></th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Contraseña por defecto para abrir el formulario
        const ADMIN_PASSWORD = "admin123";
        let isAdmin = false;

        // Cargar datos guardados previamente en el navegador, o usar datos iniciales
        const initialTeams = [
            { id: 1, team: "IGNITIA", rocket: "Ignitia-1", theoreticalHeight: 140.0, sensorHeight: 142.0 },
            { id: 2, team: "Apolo Group", rocket: "Saturn V", theoreticalHeight: 130.0, sensorHeight: 125.5 },
            { id: 3, team: "Falcon X", rocket: "Heavy-1", theoreticalHeight: 100.0, sensorHeight: 110.0 },
            { id: 4, team: "Artemis Team", rocket: "Orion-X", theoreticalHeight: 110.0, sensorHeight: 95.2 }
        ];

        let teams = JSON.parse(localStorage.getItem('rocket_teams')) || initialTeams;

        function calculateError(theoretical, sensor) {
            if (!theoretical || theoretical === 0) return 0;
            const error = (Math.abs(theoretical - sensor) / theoretical) * 100;
            return Math.round(error * 100) / 100;
        }

        function toggleAdminMode() {
            if (!isAdmin) {
                const pass = prompt("Ingrese la contraseña de administrador:");
                if (pass === ADMIN_PASSWORD) {
                    isAdmin = true;
                    document.getElementById('adminPanel').classList.add('active');
                    document.getElementById('mainContainer').classList.add('admin-active');
                    document.getElementById('adminBtn').textContent = "🔓 Salir de Admin";
                } else if (pass !== null) {
                    alert("Contraseña incorrecta");
                }
            } else {
                isAdmin = false;
                document.getElementById('adminPanel').classList.remove('active');
                document.getElementById('mainContainer').classList.remove('admin-active');
                document.getElementById('adminBtn').textContent = "⚙️ Modo Admin";
            }
            renderLeaderboard();
        }

        function renderLeaderboard() {
            const sorted = [...teams].sort((a, b) => {
                return calculateError(a.theoreticalHeight, a.sensorHeight) - calculateError(b.theoreticalHeight, b.sensorHeight);
            });

            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '';

            sorted.forEach((item, index) => {
                const pos = index + 1;
                const errorPct = calculateError(item.theoreticalHeight, item.sensorHeight);

                let badgeHtml = `<span class="pos-badge">${pos}</span>`;
                if (pos === 1) badgeHtml = `<span class="pos-badge pos-1">🥇 1</span>`;
                else if (pos === 2) badgeHtml = `<span class="pos-badge pos-2">🥈 2</span>`;
                else if (pos === 3) badgeHtml = `<span class="pos-badge pos-3">🥉 3</span>`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="text-align: center;">${badgeHtml}</td>
                    <td>
                        <div class="team-name">${escapeHtml(item.team)}</div>
                        <div class="rocket-name">Cohete: ${escapeHtml(item.rocket)}</div>
                    </td>
                    <td style="text-align: center;">${item.theoreticalHeight} m</td>
                    <td style="text-align: center;">${item.sensorHeight} m</td>
                    <td class="error-val">${errorPct}%</td>
                    <td style="text-align: center;">
                        ${isAdmin ? `<button class="btn-delete" onclick="deleteTeam(${item.id})">🗑️</button>` : ''}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function addTeam(e) {
            e.preventDefault();
            const newTeam = {
                id: Date.now(),
                team: document.getElementById('teamName').value,
                rocket: document.getElementById('rocketName').value,
                theoreticalHeight: parseFloat(document.getElementById('theoreticalHeight').value),
                sensorHeight: parseFloat(document.getElementById('sensorHeight').value)
            };

            teams.push(newTeam);
            saveAndRender();
            document.getElementById('rocketForm').reset();
        }

        function deleteTeam(id) {
            if (confirm("¿Estás seguro de eliminar este registro?")) {
                teams = teams.filter(t => t.id !== id);
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('rocket_teams', JSON.stringify(teams));
            renderLeaderboard();
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        window.onload = renderLeaderboard;
    </script>
</body>
</html>

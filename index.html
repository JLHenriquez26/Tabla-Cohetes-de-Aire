<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competencia de Cohetes de Aire - Tabla de Posiciones</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --card-border: #1f293d;
            --neon-green: #00ff87;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --gold: #fbbf24;
            --silver: #cbd5e1;
            --bronze: #d97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 950px;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .logo-container {
            margin-bottom: 1.25rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            max-height: 75px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(0, 255, 135, 0.25));
        }

        .title {
            color: var(--neon-green);
            font-size: 2.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(0, 255, 135, 0.4);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .controls-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .sync-status {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 320px;
        }

        .search-input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 0.65rem 1rem 0.65rem 2.4rem;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        .search-input:focus { border-color: var(--neon-green); }

        .search-icon {
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .table-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        thead {
            background-color: #162032;
            border-bottom: 2px solid var(--card-border);
        }

        th {
            padding: 1rem 1.25rem;
            color: var(--neon-green);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        td {
            padding: 1.1rem 1.25rem;
            border-bottom: 1px solid var(--card-border);
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: rgba(0, 255, 135, 0.03); }

        .pos-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-weight: 800;
            font-size: 0.95rem;
            background: #1f293d;
            color: var(--text-main);
        }

        .pos-1 { background: rgba(251, 191, 36, 0.15); color: var(--gold); border: 1px solid var(--gold); }
        .pos-2 { background: rgba(203, 213, 225, 0.15); color: var(--silver); border: 1px solid var(--silver); }
        .pos-3 { background: rgba(217, 119, 6, 0.15); color: var(--bronze); border: 1px solid var(--bronze); }

        .group-tag {
            display: inline-block;
            background: rgba(31, 41, 61, 0.8);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .team-name { font-weight: 700; color: var(--text-main); font-size: 1.05rem; }
        .rocket-name { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

        .error-val {
            font-weight: 800;
            color: var(--neon-green);
            font-size: 1.05rem;
            text-align: right;
        }

        .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-container">
                <img src="tecnologico-de-monterrey-blue.png" alt="Tecnológico de Monterrey">
            </div>
            <h1 class="title">🚀 Competencia de Cohetes de Aire 🚀</h1>
            <p class="subtitle">UNIDAD DE FORMACIÓN F1025B</p>
            <p class="subtitle">Tabla de Posiciones General</p>
        </header>

        <div class="controls-wrapper">
            <div class="sync-status" id="syncStatus">🔄 Sincronizando datos con la nube...</div>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar equipo, cohete o grupo..." oninput="renderLeaderboard()">
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="text-align: center; width: 70px;">POS</th>
                        <th style="text-align: center;">GRUPO</th>
                        <th>EQUIPO / COHETE</th>
                        <th style="text-align: center;">ALT. TEÓRICA</th>
                        <th style="text-align: center;">ALT. SENSOR</th>
                        <th style="text-align: right;">% ERROR</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <tr><td colspan="6" class="empty-state">Cargando registros...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzMDHFnR5B4JGWP66-EJa35y3BdOcOygVNWrgB3d5-w68FixJlTqVh_FwY3Q_R3H0UO/exec";
        let teams = [];

        function calculateError(theoretical, sensor) {
            if (!theoretical || theoretical === 0) return 0;
            const error = (Math.abs(theoretical - sensor) / theoretical) * 100;
            return Math.round(error * 100) / 100;
        }

        async function fetchTeams() {
            if (WEB_APP_URL.includes("PEGAR_AQUÍ") || WEB_APP_URL.includes("TU_URL_REAL_AQUI")) return;
            try {
                const response = await fetch(WEB_APP_URL);
                teams = await response.json();
                renderLeaderboard();
                
                const now = new Date();
                const timeString = now.toLocaleTimeString();
                document.getElementById('syncStatus').innerText = `🟢 Última actualización: ${timeString}`;
            } catch (error) {
                console.error("Error al obtener datos:", error);
                document.getElementById('syncStatus').innerText = "⚠️ Error al sincronizar con la nube";
            }
        }

        function renderLeaderboard() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const sorted = [...teams].sort((a, b) => calculateError(a.theoreticalHeight, a.sensorHeight) - calculateError(b.theoreticalHeight, b.sensorHeight));

            let currentPos = 1;
            const rankedTeams = sorted.map((item, index) => {
                const errorPct = calculateError(item.theoreticalHeight, item.sensorHeight);
                if (index > 0) {
                    const prevErrorPct = calculateError(sorted[index - 1].theoreticalHeight, sorted[index - 1].sensorHeight);
                    // Si el porcentaje de error es exactamente igual, comparten la misma posición (empate)
                    if (errorPct !== prevErrorPct) {
                        currentPos = index + 1;
                    }
                }
                return { ...item, pos: currentPos, errorPct: errorPct };
            });

            const filteredTeams = rankedTeams.filter(item => 
                (item.group && item.group.toLowerCase().includes(searchTerm)) ||
                item.team.toLowerCase().includes(searchTerm) || 
                item.rocket.toLowerCase().includes(searchTerm)
            );

            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '';

            if (filteredTeams.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-state">${teams.length === 0 ? "Aún no hay equipos registrados en la nube." : "No se encontraron resultados."}</td></tr>`;
                return;
            }

            filteredTeams.forEach((item) => {
                const pos = item.pos;
                let badgeHtml = `<span class="pos-badge">${pos}</span>`;
                if (pos === 1) badgeHtml = `<span class="pos-badge pos-1">🥇 1</span>`;
                else if (pos === 2) badgeHtml = `<span class="pos-badge pos-2">🥈 2</span>`;
                else if (pos === 3) badgeHtml = `<span class="pos-badge pos-3">🥉 3</span>`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="text-align: center;">${badgeHtml}</td>
                    <td style="text-align: center;"><span class="group-tag">${escapeHtml(item.group || '-')}</span></td>
                    <td>
                        <div class="team-name">${escapeHtml(item.team)}</div>
                        <div class="rocket-name">Cohete: ${escapeHtml(item.rocket)}</div>
                    </td>
                    <td style="text-align: center;">${item.theoreticalHeight} m</td>
                    <td style="text-align: center;">${item.sensorHeight} m</td>
                    <td class="error-val">${item.errorPct}%</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        window.onload = () => {
            fetchTeams();
            setInterval(fetchTeams, 10000);
        };
    </script>
</body>
</html>
